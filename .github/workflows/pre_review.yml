name: Python Application CI

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f python_template_repo/requirements.txt ]; then pip install -r python_template_repo/requirements.txt; fi

    - name: Lint with flake8
      run: |
        # Sprawdzamy tylko folder z Twoim kodem
        flake8 python_template_repo/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 python_template_repo/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run tests with pytest
      run: |
        # Uruchamiamy pytest wskazując na folder z testami
        pytest python_template_repo/tests/
        